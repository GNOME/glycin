[package]
name = "glycin-image-rs"
version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["external"]
builtin = ["glycin-utils/builtin"]
external = ["glycin-utils/external"]

[dependencies]
bytemuck.workspace = true
exr.workspace = true
glycin-common.workspace = true
glycin-utils = { workspace = true, features = [
    "async-io",
    "image-rs",
    "loader-utils",
] }
gufo-common.workspace = true
gufo-exif.workspace = true
gufo = { workspace = true, features = ["jpeg", "png", "tiff", "webp"] }
gufo-jpeg = { workspace = true, features = ["encoder"] }
hayro-jpeg2000 = { workspace = true, features = ["image"] }
image-extras.workspace = true
image = { workspace = true, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "png",
    "pnm",
    "qoi",
    "tga",
    "webp",
] }
jpeg-encoder.workspace = true
jxl.workspace = true
log.workspace = true
moxcms.workspace = true
png.workspace = true
rayon.workspace = true
tiff.workspace = true
zune-jpeg.workspace = true
